button:disabled{opacity:.6;cursor:wait}
.err{color:#FF7A7A;font-size:13px;min-height:1.2em}
.bar{height:3px;background:#1a1f2b;border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#7C8CFF;transition:width .2s}

function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function dec(key,buf){buf=new Uint8Array(buf);return crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(0,12)},key,buf.slice(12))}
var f=document.getElementById('f'),pw=document.getElementById('pw'),err=document.getElementById('err'),go=document.getElementById('go'),bar=document.getElementById('bar'),bi=document.getElementById('bi');
f.addEventListener('submit',async function(e){
  e.preventDefault();err.textContent='';go.disabled=true;go.textContent='Проверяем…';
  try{
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.value),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var data;
    try{data=JSON.parse(new TextDecoder().decode(await dec(key,b64(BLOB))))}catch(x){throw 'pw'}
    pw.value='';go.textContent='Загружаем…';bar.hidden=false;
    var keys=Object.keys(data.media),done=0,doc=data.doc;
    var urls=await Promise.all(keys.map(async function(k){
      var m=data.media[k],r=await fetch(m[0]);if(!r.ok)throw 'net';
      var plain=await dec(key,await r.arrayBuffer());done++;bi.style.width=(done/keys.length*100)+'%';
      return [k,URL.createObjectURL(new Blob([plain],{type:m[1]}))];
    }));
    urls.sort(function(a,b){return b[0].length-a[0].length}).forEach(function(u){doc=doc.split(u[0]).join(u[1])});
    document.open();document.write(doc);document.close();
  }catch(x){
    go.disabled=false;go.textContent='Открыть';bar.hidden=true;
    err.textContent=x==='pw'?'Неверный пароль. Проверьте раскладку и попробуйте ещё раз.':'Не удалось загрузить страницу. Обновите её и попробуйте снова.';
    pw.select();
  }
});
